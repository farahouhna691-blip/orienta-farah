}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatInlineMarkdown(text) {
  var safe = escapeHtml(text);
  return safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function renderFormattedText(rawText) {
  var lines = String(rawText || "").split(/\r?\n/);
  var html = "";
  var inList = false;

  function closeList() {
    if (inList) {
      html += "</ul>";
      inList = false;
    }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) {
      closeList();
      continue;
    }

    if (/^[-*]{3,}$/.test(line)) {
      closeList();
      html += "<hr />";
      continue;
    }

    if (/^\|[-:\s|]+\|$/.test(line)) {
      continue;
    }

    if (/^\|.*\|$/.test(line)) {
      closeList();
      var cells = line
        .slice(1, -1)
        .split("|")
        .map(function(c) { return formatInlineMarkdown(c.trim()); })
        .filter(Boolean);
      if (cells.length) {
        html += "<p>" + cells.join(" • ") + "</p>";
      }
      continue;
    }

    var headingMatch = line.match(/^#{1,4}\s*(.+)$/);
    if (headingMatch) {
      closeList();
      html += "<div class='sec-title'>" + formatInlineMarkdown(headingMatch[1]) + "</div>";
      continue;
    }

    var bulletMatch = line.match(/^(?:[-*•]|\d+[.)])\s+(.+)$/);
    if (bulletMatch) {
      if (!inList) {
        html += "<ul>";
        inList = true;
      }
      html += "<li>" + formatInlineMarkdown(bulletMatch[1]) + "</li>";
      continue;
    }

    closeList();
    html += "<p>" + formatInlineMarkdown(line) + "</p>";
  }

  closeList();
  return html || "<p>" + escapeHtml(rawText) + "</p>";
}

function isNonChatModel(id) {
  var s = (id || "").toLowerCase();
  return (
    s.indexOf("guard") !== -1 ||
    s.indexOf("whisper") !== -1 ||
    s.indexOf("orpheus") !== -1 ||
    s.indexOf("tts") !== -1 ||
    s.indexOf("embed") !== -1 ||
    s.indexOf("moderation") !== -1 ||
    s.indexOf("audio") !== -1
  );
}

async function extractPdfContent(file) {
  if (!window.pdfjsLib) {
    throw new Error("pdf.js غير متوفر");
  }
  var arrayBuf = await file.arrayBuffer();
  var pdf = await window.pdfjsLib.getDocument({ data: arrayBuf }).promise;
  var maxPages = Math.min(pdf.numPages, 4);
  var extractedText = "";
  var renderedImages = [];

  for (var p = 1; p <= maxPages; p++) {
    var page = await pdf.getPage(p);
    var textContent = await page.getTextContent();
    var pageText = (textContent.items || [])
      .map(function(item) { return item && typeof item.str === "string" ? item.str : ""; })
      .join(" ")
      .replace(/\s+/g, " ")
      .trim();
    if (pageText) {
      extractedText += "[Page " + p + "] " + pageText + "\n";
    }

    var viewport = page.getViewport({ scale: 1.4 });
    var canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    var dataUrl = canvas.toDataURL("image/png");
    var base64 = dataUrl.indexOf(",") !== -1 ? dataUrl.split(",")[1] : "";
    if (base64) {
      renderedImages.push({ base64: base64, mimeType: "image/png" });
    }
  }

  return {
    text: extractedText.trim().slice(0, 8000),
    images: renderedImages
  };
}

function onGradeFileSelected(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  var t = I18N[lang];
  var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  var isImage = /^image\//.test(file.type) || /\.(png|jpe?g|webp)$/i.test(file.name);

  if (isPdf) {
    document.getElementById("grade-status").textContent = t.readingPdf;
    document.getElementById("t-analyze-grades").disabled = true;
    extractPdfContent(file)
      .then(function(pdfRes) {
        gradeData = {
          name: file.name,
          text: pdfRes.text,
          images: pdfRes.text ? [] : pdfRes.images
        };
        updateGradesUI();
      })
      .catch(function() {
        gradeData = null;
        updateGradesUI();
      });
    return;
  }

  if (isImage) {
    var reader = new FileReader();
    reader.onload = function() {
      var res = String(reader.result || "");
      var base64 = res.indexOf(",") !== -1 ? res.split(",")[1] : "";
      gradeData = {
        name: file.name,
        text: "",
        images: base64 ? [{ base64: base64, mimeType: file.type || "image/png" }] : []
      };
      updateGradesUI();
    };
    reader.readAsDataURL(file);
    return;
  }

  file.text().then(function(content) {
    gradeData = {
      name: file.name,
      text: String(content || "").slice(0, 8000),
      images: []
    };
    updateGradesUI();
  });
}

function setStatus(msg, isOk) {
  var el = document.getElementById("setup-status");
  el.textContent = msg || "";
  el.className = "status-msg " + (msg ? (isOk ? "status-ok" : "status-err") : "");
}

function onProviderChange() {
  var prov = document.getElementById("api-provider").value;
  var mInp = document.getElementById("api-model-inp");
  mInp.value = prov === "groq" ? "openai/gpt-oss-20b" : "gemini-2.5-flash";
  setStatus("", false);
}

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  document.documentElement.lang = l;
  document.body.classList.toggle("rtl", l === "ar");
  document.getElementById("lang-sel").value = l;
  var btns = document.querySelectorAll(".lang-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", btns[i].dataset.l === l);
  }
  var t = I18N[l];
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("t-reset").textContent = t.reset;
  document.getElementById("t-head").textContent = t.head;
  document.getElementById("t-desc").textContent = t.desc;
  document.getElementById("t-provider-lbl").textContent = t.providerLbl;
  document.getElementById("t-key-lbl").textContent = t.keyLbl;
  document.getElementById("t-model-lbl").textContent = t.modelLbl;
  document.getElementById("api-key-inp").placeholder = t.keyPh;
  document.getElementById("t-models").textContent = t.modelsBtn;
  document.getElementById("t-test").textContent = t.testBtn;
  document.getElementById("t-start").textContent = t.start;
  document.getElementById("t-upload").textContent = t.uploadBtn;
  document.getElementById("t-analyze-grades").textContent = t.analyzeGradesBtn;
  updateGradesUI();
  document.getElementById("inp").placeholder = step >= 8 ? t.phExtra : t.ph;
  document.getElementById("t-send").textContent = t.send;
}

function setBar(n) {
  document.getElementById("bar-fill").style.width = Math.min(Math.round((n / TOTAL) * 100), 100) + "%";
}

function validateConfig(requireModel) {
  var provVal = document.getElementById("api-provider").value;
  var keyVal = document.getElementById("api-key-inp").value.trim();
  var modVal = document.getElementById("api-model-inp").value.trim();
  var t = I18N[lang];

  if (!keyVal) {
    setStatus(t.needKey, false);
    return null;
  }
  if (provVal === "groq" && keyVal.indexOf("AIza") === 0) {
    setStatus(t.mismatchGroq, false);
    return null;
  }
  if (provVal === "gemini" && keyVal.indexOf("gsk_") === 0) {
    setStatus(t.mismatchGemini, false);
    return null;
  }
  if (requireModel && !modVal) {
    setStatus(t.needModel, false);
    return null;
  }
  if (requireModel && isNonChatModel(modVal)) {
    setStatus(t.nonChatModel, false);
    return null;
  }
  setStatus("", false);
  return { provVal: provVal, keyVal: keyVal, modVal: modVal };
}

async function fetchAvailableModels() {
  var cfg = validateConfig(false);
  if (!cfg) return;
  var t = I18N[lang];
  setStatus(t.loadingModels, true);

  try {
    if (cfg.provVal === "groq") {
      var resG = await fetch("https://api.groq.com/openai/v1/models", {
        method: "GET",
        headers: { "Authorization": "Bearer " + cfg.keyVal }
      });
      var dataG = await resG.json().catch(function() { return null; });
      if (!resG.ok) {
        var errG = dataG && dataG.error && dataG.error.message ? (" — " + dataG.error.message) : "";
        throw new Error("HTTP " + resG.status + errG);
      }
      var listG = (dataG && dataG.data) || [];
      var chatIdsG = listG
        .map(function(m) { return m.id; })
        .filter(function(id) { return Boolean(id) && !isNonChatModel(id); });
      if (!chatIdsG.length) {
        setStatus(t.noModels, false);
        return;
      }
      var pickedG = chatIdsG[0];
      for (var i = 0; i < chatIdsG.length; i++) {
        if (chatIdsG[i].indexOf("gpt-oss") !== -1 || chatIdsG[i].indexOf("llama") !== -1) {
          pickedG = chatIdsG[i];
          break;
        }
      }
      document.getElementById("api-model-inp").value = pickedG;
      setStatus(t.modelsFound + pickedG + " (" + chatIdsG.slice(0, 5).join(", ") + ")", true);
    } else {
      var urlM = "https://generativelanguage.googleapis.com/v1beta/models?key=" + encodeURIComponent(cfg.keyVal);
      var resM = await fetch(urlM);
      var dataM = await resM.json().catch(function() { return null; });
      if (!resM.ok) {
        var errM = dataM && dataM.error && dataM.error.message ? (" — " + dataM.error.message) : "";
        throw new Error("HTTP " + resM.status + errM);
      }
      var listM = (dataM && dataM.models) || [];
      var namesM = listM
        .map(function(m) { return (m.name || "").replace(/^models\//, ""); })
        .filter(function(id) { return Boolean(id) && !isNonChatModel(id); });
      if (!namesM.length) {
        setStatus(t.noModels, false);
        return;
      }
      var pickedM = namesM[0];
      for (var j = 0; j < namesM.length; j++) {
        if (namesM[j].indexOf("flash") !== -1) {
          pickedM = namesM[j];
          break;
        }
      }
      document.getElementById("api-model-inp").value = pickedM;
      setStatus(t.modelsFound + pickedM + " (" + namesM.slice(0, 5).join(", ") + ")", true);
    }
  } catch (e) {
    setStatus(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), false);
  }
}

function extractOpenAICompatibleText(data) {
  var msg = data && data.choices && data.choices[0] && data.choices[0].message;
  if (!msg) return "";
  if (typeof msg.content === "string" && msg.content.trim()) {
    return msg.content.trim();
  }
  if (Array.isArray(msg.content)) {
    var joined = msg.content
      .map(function(part) {
        if (typeof part === "string") return part;
        if (part && typeof part.text === "string") return part.text;
        return "";
      })
      .join("")
      .trim();
    if (joined) return joined;
  }
  return "";
}

async function postGroqOnce(key, mod, systemInstruction, userPrompt, maxTokens) {
  var bodyObj = {
    model: mod,
    messages: [
      { role: "system", content: systemInstruction },
      { role: "user", content: userPrompt }
    ],
    temperature: 0.45,
    max_tokens: maxTokens
  };
  if (mod.toLowerCase().indexOf("gpt-oss") !== -1) {
    bodyObj.reasoning_effort = "low";
  }

  var resG = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + key
    },
    body: JSON.stringify(bodyObj)
  });
  var dataG = await resG.json().catch(function() { return null; });
  if (!resG.ok) {
    var detailG = dataG && dataG.error && dataG.error.message ? (" — " + dataG.error.message) : "";
    throw new Error("HTTP " + resG.status + detailG);
  }
  return extractOpenAICompatibleText(dataG);
}

async function callLLMWithConfig(prov, key, mod, systemInstruction, userPrompt, maxTokens, inlineImages) {
  var baseBudget = maxTokens || 1500;
  var langGuard = getLanguageRule(lang);
  var fullSystem = langGuard + "\n" + systemInstruction;
  var fullUser = userPrompt + "\n\n" + langGuard;

  if (prov === "groq") {
    var txtG = await postGroqOnce(key, mod, fullSystem, fullUser, baseBudget);
    if (!txtG) {
      txtG = await postGroqOnce(key, mod, fullSystem, fullUser, Math.max(baseBudget * 2, 2400));
    }
    if (!txtG) throw new Error("Réponse vide");
    return txtG;
  }

  var cleanMod = mod.replace(/^models\//, "");
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(cleanMod) + ":generateContent?key=" + encodeURIComponent(key);
  var partsPayload = [{ text: fullSystem + "\n\n" + fullUser }];
  if (Array.isArray(inlineImages)) {
    for (var k = 0; k < inlineImages.length; k++) {
      if (inlineImages[k] && inlineImages[k].base64) {
        partsPayload.push({
          inlineData: {
            mimeType: inlineImages[k].mimeType || "image/png",
            data: inlineImages[k].base64
          }
        });
      }
    }
  }

  var resM = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: partsPayload }],
      generationConfig: { temperature: 0.45, maxOutputTokens: Math.max(baseBudget, 1200) }
    })
  });
  var dataM = await resM.json().catch(function() { return null; });
  if (!resM.ok) {
    var detailM = dataM && dataM.error && dataM.error.message ? (" — " + dataM.error.message) : "";
    throw new Error("HTTP " + resM.status + detailM);
  }
  var parts = dataM && dataM.candidates && dataM.candidates[0] && dataM.candidates[0].content && dataM.candidates[0].content.parts;
  var txtM = "";
  if (Array.isArray(parts)) {
    txtM = parts
      .filter(function(p) { return p && typeof p.text === "string" && !p.thought; })
      .map(function(p) { return p.text; })
      .join("")
      .trim();
  }
  if (!txtM) throw new Error("Réponse vide");
  return txtM;
}

async function analyzeGrades() {
  if (!gradeData) return;
  var t = I18N[lang];
  var hasImages = Array.isArray(gradeData.images) && gradeData.images.length > 0;

  if (!gradeData.text && hasImages && provider !== "gemini") {
    addBot(t.imageNeedsGemini, t.errTag, "err");
    return;
  }

  addUser(t.uploadBtn + " : " + gradeData.name);
  setLoading(true);
  var analyzeBtn = document.getElementById("t-analyze-grades");
  analyzeBtn.disabled = true;
  var waitEl = addBot(t.thinking, t.apiTag);

  try {
    var ctx = historyQA.length
      ? historyQA.map(function(x) { return "Q" + x.q + ": " + x.ans; }).join(" | ")
      : "Aucun historique de questions préalable.";

    var sys =
      "Tu es orienta_farah, un conseiller d'orientation académique rigoureux et bienveillant. " +
      "Analyse le relevé de notes fourni de manière précise, réaliste et structurée (sans tableaux Markdown '|' ni crochets). " +
      "N'invente pas de seuils chiffrés officiels incertains ; explique plutôt les critères d'accès (dossier, notes clés, concours).";

    var prompt =
      "Contexte de l'élève: [" +
      ctx +
      "].\n" +
      (gradeData.text
        ? "Contenu extrait du relevé (" + gradeData.name + "):\n" + gradeData.text + "\n\n"
        : "Le relevé de notes (" + gradeData.name + ") est joint sous forme de page(s) image(s).\n\n") +
      "Structure ta réponse exactement ainsi:\n" +
      "### Points forts et points faibles\n" +
      "Liste à puces (- ) des matières/compétences fortes et des axes d'amélioration à partir des notes.\n" +
      "### Écoles et filières à cibler\n" +
      "Liste à puces (- ) des types d'écoles ou filières cohérentes avec ces notes et ce profil, en expliquant le lien avec les résultats.\n" +
      "### Concours et plan de préparation\n" +
      "Liste numérotée (1. 2. 3.) des concours/voies à préparer et des priorités de révision concrètes.";

    var imgsToSend = !gradeData.text && hasImages ? gradeData.images : null;
    var resTxt = await callLLMWithConfig(provider, apiKey, modelName, sys, prompt, 2400, imgsToSend);
    waitEl.remove();
    addBot(resTxt, t.gradesTag, "grades");
  } catch (e) {
    waitEl.remove();
    addBot(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), t.errTag, "err");
  } finally {
    analyzeBtn.disabled = false;
    setLoading(false);
    document.getElementById("inp").focus();
  }
}

async function testApiKey() {
  var cfg = validateConfig(true);
  if (!cfg) return;
  var t = I18N[lang];
  var modelsBtn = document.getElementById("t-models");
  var testBtn = document.getElementById("t-test");
  var startBtn = document.getElementById("t-start");
  modelsBtn.disabled = true;
  testBtn.disabled = true;
  startBtn.disabled = true;
  setStatus(t.testing, true);
  try {
    await callLLMWithConfig(cfg.provVal, cfg.keyVal, cfg.modVal, "Reply with OK.", "OK", 1500);
    setStatus(t.testOk, true);
  } catch (e) {
    setStatus(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), false);
  } finally {
    modelsBtn.disabled = false;
    testBtn.disabled = false;
    startBtn.disabled = false;
  }
}

function setLoading(loading) {
  document.getElementById("inp").disabled = loading;
  document.getElementById("t-send").disabled = loading;
}

async function startApp() {
  var cfg = validateConfig(true);
  if (!cfg) return;
  var t = I18N[lang];

  provider = cfg.provVal;
  apiKey = cfg.keyVal;
  modelName = cfg.modVal;
  step = 1;
  historyQA = [];

  document.getElementById("setup").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  document.getElementById("msgs").innerHTML = "";
  document.getElementById("inp").placeholder = t.ph;
  updateGradesUI();
  setBar(1);

  setLoading(true);
  var waitEl = addBot(t.thinking, t.apiTag);
  try {
    var sys = "You are orienta_farah, a clear, friendly post-graduation guidance agent. Never use Markdown tables (|) or placeholders like [Name].";
    var prompt = "Ask only question 1 out of 7 about this topic: " + QUESTION_TOPICS[lang][1] + ". Be clear, natural, and concise.";
    var q1 = await callLLMWithConfig(provider, apiKey, modelName, sys, prompt, 1500);
    waitEl.remove();
    addBot(q1, t.qTag(1));
  } catch (e) {
    waitEl.remove();
    addBot(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), t.errTag, "err");
  } finally {
    setLoading(false);
    document.getElementById("inp").focus();
  }
}

function resetApp() {
  step = 0;
  historyQA = [];
  gradeData = null;
  document.getElementById("grade-file-inp").value = "";
  updateGradesUI();
  document.getElementById("chat").style.display = "none";
  document.getElementById("setup").style.display = "flex";
  document.getElementById("msgs").innerHTML = "";
  setBar(0);
}

async function onSend() {
  var inp = document.getElementById("inp");
  var txt = inp.value.trim();
  if (!txt || inp.disabled) return;
  inp.value = "";
  addUser(txt);

  var t = I18N[lang];
  var sys =
    "You are orienta_farah, a post-graduation guidance agent. Never use Markdown tables (|) or placeholders like [Name]. Never repeat an already asked question.";

  setLoading(true);

  if (step >= 1 && step < TOTAL) {
    historyQA.push({ q: step, ans: txt });
    var nextQ = step + 1;
    var waitQ = addBot(t.thinking, t.apiTag);
    try {
      var summarySoFar = historyQA.map(function(x) { return "Q" + x.q + ": " + x.ans; }).join(" | ");
      var coveredTopics = Object.keys(QUESTION_TOPICS[lang])
        .slice(0, step)
        .map(function(k) { return QUESTION_TOPICS[lang][k]; })
        .join("; ");
      var qPrompt =
        "Previous answers: [" +
        summarySoFar +
        "]. Already covered topics: [" +
        coveredTopics +
        "]. Ask ONLY question " +
        nextQ +
        " out of " +
        TOTAL +
        " focused strictly on this new topic: [" +
        QUESTION_TOPICS[lang][nextQ] +
        "]. One single clear and natural question, without repeating previous topics.";
      var replyQ = await callLLMWithConfig(provider, apiKey, modelName, sys, qPrompt, 1500);
      waitQ.remove();
      step = nextQ;
      setBar(step);
      addBot(replyQ, t.qTag(step));
    } catch (e) {
      waitQ.remove();
      historyQA.pop();
      addBot(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), t.errTag, "err");
    } finally {
      setLoading(false);
      inp.focus();
    }
    return;
  }

  if (step === TOTAL) {
    historyQA.push({ q: step, ans: txt });
    setBar(TOTAL);
    var waitB = addBot(t.thinking, t.apiTag);
    try {
      var allQ = historyQA.map(function(x) { return "Q" + x.q + ": " + x.ans; }).join(" | ");
      var bilanPrompt =
        "Here are the 7 answers from the student: [" +
        allQ +
        "]. Write a clear, well-structured guidance summary directly tailored to these answers (no tables, no brackets):\n" +
        "### Profile summary\n" +
        "One short clear paragraph summarizing the answers.\n" +
        "### Recommended tracks\n" +
        "A bullet list (- ) of 2 to 3 suitable tracks with a clear reason based on the answers.\n" +
        "### 3-step action plan\n" +
        "A numbered list (1. 2. 3.) of 3 concrete next steps.";
      var bilanTxt = await callLLMWithConfig(provider, apiKey, modelName, sys, bilanPrompt, 2200);
      waitB.remove();
      step = TOTAL + 1;
      addBot(bilanTxt, t.bTag);
      inp.placeholder = t.phExtra;
    } catch (e) {
      waitB.remove();
      historyQA.pop();
      addBot(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), t.errTag, "err");
    } finally {
      setLoading(false);
      inp.focus();
    }
    return;
  }

  var waitE = addBot(t.thinking, t.apiTag);
  try {
    var ctx = historyQA.map(function(x) { return "Q" + x.q + ": " + x.ans; }).join(" | ");
    var gradeCtx = gradeData && gradeData.text ? "\nImported grades:\n" + gradeData.text : "";
    var extraPrompt =
      "Student profile (7 answers): [" +
      ctx +
      "]." +
      gradeCtx +
      "\nStudent question: " +
      txt +
      "\nAnswer clearly, concisely, and helpfully using short paragraphs or bullet points (- ), taking their profile into account.";
    var extraTxt = await callLLMWithConfig(provider, apiKey, modelName, sys, extraPrompt, 1800);
    waitE.remove();
    addBot(extraTxt, t.apiTag);
  } catch (e) {
    waitE.remove();
    addBot(t.apiFailPrefix + (e && e.message ? e.message : "Erreur"), t.errTag, "err");
  } finally {
    setLoading(false);
    inp.focus();
  }
}

function addBot(txt, tag, badgeType) {
  var box = document.getElementById("msgs");
  var d = document.createElement("div");
  d.className = "msg bot";
  if (tag) {
    var tg = document.createElement("div");
    tg.className = badgeType === "err" ? "tag err" : (badgeType === "grades" ? "tag grades" : "tag");
    tg.textContent = tag;
    d.appendChild(tg);
  }
  var b = document.createElement("div");
  b.innerHTML = renderFormattedText(txt);
  d.appendChild(b);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function addUser(txt) {
  var box = document.getElementById("msgs");
  var d = document.createElement("div");
  d.className = "msg user";
  d.textContent = txt;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
